name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run test suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-${{ matrix.python-version }}.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 7

  rust-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path rust/popperpad-core/Cargo.toml -- --check

      - name: Lint hardened kernel
        run: cargo clippy --manifest-path rust/popperpad-core/Cargo.toml --all-targets -- -D warnings

      - name: Test Python-Rust parity kernel
        run: cargo test --manifest-path rust/popperpad-core/Cargo.toml --all-targets

  materialize-esso-refinement:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/esso-market-refinement' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esso-market-refinement
      - name: Publish verified ESSO refinement sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: agent/esso-market-refinement
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          chunk_paths = sorted(Path('.esso-payload').glob('part-*'))
          encoded = b''.join(path.read_bytes() for path in chunk_paths)
          if len(encoded) != 25_476:
              raise SystemExit(f'payload length differs: {len(encoded)}')
          if hashlib.sha256(encoded).hexdigest() != '3f9c9db2aa810f1a9eac9346b431c316620732364a505389bb43aee36169eec9':
              raise SystemExit('encoded payload digest differs')
          raw = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(raw).hexdigest() != 'f24316cb6098c90ca3b020aa183e96eabfb20f684de9a451d997376e6ccfe250':
              raise SystemExit('decoded ZIP digest differs')

          expected = {
              'src/popperpad/core/market.py': '92a0e85563c8363c382da3527a774fd717f096924691158309c396f3caeaeb6a',
              'src/popperpad/esso_market_adapter.py': 'f42d3601cbbe2cd5a4f87e9b521d815345f66da7918486d5eb1e7a52d1bed9b8',
              'tests/test_market_transitions.py': 'a17142ea4ecd9877dbb4d31ec9e4646bb5fd94c239bab5449d6351aaf44f9ea3',
              'tests/test_esso_market_adapter.py': '4937704b522d55eeaf37493e92d014c688fc9c22619f932069d4b20a50701281',
          }
          archive = zipfile.ZipFile(io.BytesIO(raw))
          if set(archive.namelist()) != set(expected):
              raise SystemExit(f'archive paths differ: {sorted(archive.namelist())}')
          for path, digest in expected.items():
              if hashlib.sha256(archive.read(path)).hexdigest() != digest:
                  raise SystemExit(f'archive digest differs: {path}')

          token = os.environ['GH_TOKEN']
          repository = os.environ['GH_REPOSITORY']
          branch = os.environ['GH_BRANCH']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'popperpad-esso-materializer',
          }

          def request(url: str, *, method: str = 'GET', body: dict | None = None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as error:
                  payload = error.read().decode('utf-8', errors='replace')
                  if error.code == 404:
                      return 404, None
                  raise RuntimeError(f'{method} {url}: HTTP {error.code}: {payload}') from error

          for path in sorted(expected):
              quoted = urllib.parse.quote(path, safe='/')
              url = f'https://api.github.com/repos/{repository}/contents/{quoted}'
              status, current = request(url + '?' + urllib.parse.urlencode({'ref': branch}))
              body = {
                  'message': f'Apply ESSO refinement source: {path}',
                  'content': base64.b64encode(archive.read(path)).decode('ascii'),
                  'branch': branch,
              }
              if status == 200:
                  body['sha'] = current['sha']
              request(url, method='PUT', body=body)
              print(f'published {path}')
          PY

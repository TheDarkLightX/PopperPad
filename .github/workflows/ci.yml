name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run test suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-${{ matrix.python-version }}.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 7

  rust-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Produce canonical rustfmt output
        run: cargo fmt --manifest-path rust/popperpad-core/Cargo.toml

      - name: Upload formatted Rust source
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-kernel
          path: rust/popperpad-core/src/lib.rs
          if-no-files-found: error
          retention-days: 1

      - name: Lint hardened kernel
        run: cargo clippy --manifest-path rust/popperpad-core/Cargo.toml --all-targets -- -D warnings

      - name: Test Python-Rust parity kernel
        run: cargo test --manifest-path rust/popperpad-core/Cargo.toml --all-targets

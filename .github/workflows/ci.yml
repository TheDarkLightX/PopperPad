name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run test suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-${{ matrix.python-version }}.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 7

  rust-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path rust/popperpad-core/Cargo.toml -- --check

      - name: Lint hardened kernel
        run: cargo clippy --manifest-path rust/popperpad-core/Cargo.toml --all-targets -- -D warnings

      - name: Test Python-Rust parity kernel
        run: cargo test --manifest-path rust/popperpad-core/Cargo.toml --all-targets

  materialize-esso-refinement:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/esso-market-refinement' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esso-market-refinement
          fetch-depth: 0
      - name: Materialize reviewed source payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import zipfile
          from pathlib import Path

          source = Path('.github/workflows/apply-esso-market-refinement.yml').read_text(encoding='utf-8')
          encoded = source.split("<<'PAYLOAD'\n", 1)[1].split("\nPAYLOAD\n", 1)[0].strip()
          expected = {
              'src/popperpad/core/market.py',
              'src/popperpad/esso_market_adapter.py',
              'tests/test_market_transitions.py',
              'tests/test_esso_market_adapter.py',
          }
          archive = zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded, validate=True)))
          names = set(archive.namelist())
          if names != expected:
              raise SystemExit(f'archive paths differ: {sorted(names)}')
          for name in sorted(names):
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(archive.read(name))
          PY
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add src/popperpad/core/market.py src/popperpad/esso_market_adapter.py tests/test_market_transitions.py tests/test_esso_market_adapter.py
          if git diff --cached --quiet; then
            echo 'No source changes to apply.'
            exit 0
          fi
          git commit -m 'Prove the market through an ESSO runtime boundary'
          git push origin HEAD:agent/esso-market-refinement

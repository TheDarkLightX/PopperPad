name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run test suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-${{ matrix.python-version }}.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 7

  rust-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path rust/popperpad-core/Cargo.toml -- --check

      - name: Lint hardened kernel
        run: cargo clippy --manifest-path rust/popperpad-core/Cargo.toml --all-targets -- -D warnings

      - name: Test Python-Rust parity kernel
        run: cargo test --manifest-path rust/popperpad-core/Cargo.toml --all-targets

  materialize-esso-refinement:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/esso-market-refinement' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esso-market-refinement
      - name: Publish reviewed source payload through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: agent/esso-market-refinement
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          source = Path('.github/workflows/apply-esso-market-refinement.yml').read_text(encoding='utf-8')
          encoded = source.split("<<'PAYLOAD'\n", 1)[1].split("\nPAYLOAD\n", 1)[0].strip()
          expected = {
              'src/popperpad/core/market.py',
              'src/popperpad/esso_market_adapter.py',
              'tests/test_market_transitions.py',
              'tests/test_esso_market_adapter.py',
          }
          archive = zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded, validate=True)))
          names = set(archive.namelist())
          if names != expected:
              raise SystemExit(f'archive paths differ: {sorted(names)}')

          token = os.environ['GH_TOKEN']
          repository = os.environ['GH_REPOSITORY']
          branch = os.environ['GH_BRANCH']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'popperpad-esso-materializer',
          }

          def request(url: str, *, method: str = 'GET', body: dict | None = None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as error:
                  payload = error.read().decode('utf-8', errors='replace')
                  if error.code == 404:
                      return 404, None
                  raise RuntimeError(f'{method} {url}: HTTP {error.code}: {payload}') from error

          for path in sorted(names):
              quoted = urllib.parse.quote(path, safe='/')
              url = f'https://api.github.com/repos/{repository}/contents/{quoted}'
              status, current = request(url + '?' + urllib.parse.urlencode({'ref': branch}))
              body = {
                  'message': f'Apply ESSO refinement source: {path}',
                  'content': base64.b64encode(archive.read(path)).decode('ascii'),
                  'branch': branch,
              }
              if status == 200:
                  body['sha'] = current['sha']
              request(url, method='PUT', body=body)
              print(f'published {path}')
          PY

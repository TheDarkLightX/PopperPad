name: Apply PR 15 review fixes

on:
  pull_request:
    paths:
      - '.github/workflows/apply-pr15-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/fcis-market-transitions' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fcis-market-transitions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject payable states that do not reference verified submissions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: agent/fcis-market-transitions
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import textwrap
          import urllib.parse
          import urllib.request
          from pathlib import Path

          market = Path('src/popperpad/core/market.py')
          text = market.read_text(encoding='utf-8')
          if 'payable_submission_ids must reference verified submissions' not in text:
              function_start = text.index('def _validate_market_state')
              insertion_point = text.index(
                  '    if state.settlement_ref is not None and (',
                  function_start,
              )
              insertion = textwrap.dedent('''
                  submissions_by_id = {
                      submission.submission_id: submission for submission in state.submissions
                  }
                  if len(submissions_by_id) != len(state.submissions):
                      return "submission ids must be unique"
                  for submission_id in state.payable_submission_ids:
                      submission = submissions_by_id.get(submission_id)
                      if submission is None:
                          return "payable_submission_ids must reference existing submissions"
                      if submission.status is not SubmissionStatus.VERIFIED:
                          return "payable_submission_ids must reference verified submissions"
              ''')
              insertion = textwrap.indent(insertion, '    ')
              text = text[:insertion_point] + insertion + text[insertion_point:]
          market.write_text(text, encoding='utf-8')

          tests = Path('tests/test_market_transitions.py')
          text = tests.read_text(encoding='utf-8')
          if 'from dataclasses import fields, replace' not in text:
              text = text.replace('from dataclasses import fields', 'from dataclasses import fields, replace', 1)
          if 'test_payable_state_rejects_unverified_submission_ids' not in text:
              text += textwrap.dedent('''

                  def test_payable_state_rejects_unverified_submission_ids() -> None:
                      payable = apply_market_command(
                          verified_state(),
                          AdvanceBounty("cmd-advance-malformed-payable", 1_101),
                          policy(),
                      )
                      assert isinstance(payable, Accept)
                      rejected_submission = replace(
                          payable.next_state.submissions[0],
                          status=SubmissionStatus.REJECTED,
                      )
                      malformed = replace(payable.next_state, submissions=(rejected_submission,))
                      decision = apply_market_command(
                          malformed,
                          SettleBounty(
                              "cmd-malformed-settle",
                              "chain:tx:malformed",
                              (Payout("did:example:refuter", "submission-1", Amount(1_000)),),
                              1_102,
                          ),
                          policy(),
                      )
                      assert isinstance(decision, Reject)
                      assert decision.code == "INVALID_STATE"
                      assert "verified submissions" in decision.details["reason"]
              ''')
          tests.write_text(text, encoding='utf-8')

          os.system("python -m pip install -e '.[dev]' >/dev/null")
          if os.system('python -m pytest -q tests/test_market_transitions.py tests/test_market_architecture.py') != 0:
              raise SystemExit('targeted tests failed')

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'popperpad-pr15-fixer',
          }
          for path in (market, tests):
              quoted = urllib.parse.quote(str(path), safe='/')
              url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/contents/{quoted}"
              req = urllib.request.Request(url + '?ref=' + urllib.parse.quote(os.environ['GH_BRANCH']), headers=headers)
              with urllib.request.urlopen(req) as response:
                  current = json.load(response)
              body = json.dumps({
                  'message': f'Address PR 15 review: {path}',
                  'content': base64.b64encode(path.read_bytes()).decode('ascii'),
                  'sha': current['sha'],
                  'branch': os.environ['GH_BRANCH'],
              }).encode('utf-8')
              req = urllib.request.Request(url, data=body, method='PUT', headers=headers)
              with urllib.request.urlopen(req) as response:
                  print(json.load(response)['commit']['sha'])
          PY

name: Apply PR 11 review fixes

on:
  pull_request:
    paths:
      - '.github/workflows/apply-pr11-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/fcis-rust-parity-kernel' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fcis-rust-parity-kernel
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Normalize negative zero before canonical encoding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: agent/fcis-rust-parity-kernel
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          path = Path('rust/popperpad-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = '''            if encoded.contains('.') || encoded.contains('e') || encoded.contains('E') {
                          return Err(CoreError::FloatingPointNotAllowed);
                      }
                      output.push_str(&encoded);
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''            if encoded.contains('.') || encoded.contains('e') || encoded.contains('E') {
                          return Err(CoreError::FloatingPointNotAllowed);
                      }
                      if encoded == "-0" {
                          output.push('0');
                      } else {
                          output.push_str(&encoded);
                      }
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'if encoded == "-0"' not in text:
              raise SystemExit('negative-zero source anchor missing')

          marker = '''    #[test]
              fn floating_point_is_rejected() {
          '''
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines())
          test = '''    #[test]
              fn negative_zero_normalizes_to_python_integer_zero() {
                  let negative_zero: Value = serde_json::from_str("{\\"n\\":-0}").unwrap();
                  let zero = json!({"n": 0});
                  assert_eq!(
                      canonical_json_bytes(&negative_zero).unwrap(),
                      b"{\\"n\\":0}\\n"
                  );
                  assert_eq!(
                      canonical_hash("negative-zero/v1", &negative_zero).unwrap(),
                      canonical_hash("negative-zero/v1", &zero).unwrap()
                  );
              }

          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines())
          if 'negative_zero_normalizes_to_python_integer_zero' not in text:
              if marker not in text:
                  raise SystemExit('negative-zero test anchor missing')
              text = text.replace(marker, test + marker, 1)
          path.write_text(text, encoding='utf-8')

          os.system('cargo fmt --manifest-path rust/popperpad-core/Cargo.toml')
          if os.system('cargo clippy --manifest-path rust/popperpad-core/Cargo.toml --all-targets -- -D warnings') != 0:
              raise SystemExit('clippy failed')
          if os.system('cargo test --manifest-path rust/popperpad-core/Cargo.toml --all-targets') != 0:
              raise SystemExit('cargo test failed')

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'popperpad-pr11-fixer',
          }
          quoted = urllib.parse.quote(str(path), safe='/')
          url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/contents/{quoted}"
          req = urllib.request.Request(url + '?ref=' + urllib.parse.quote(os.environ['GH_BRANCH']), headers=headers)
          with urllib.request.urlopen(req) as response:
              current = json.load(response)
          body = json.dumps({
              'message': 'Address PR 11 review: normalize negative zero',
              'content': base64.b64encode(path.read_bytes()).decode('ascii'),
              'sha': current['sha'],
              'branch': os.environ['GH_BRANCH'],
          }).encode('utf-8')
          req = urllib.request.Request(url, data=body, method='PUT', headers=headers)
          with urllib.request.urlopen(req) as response:
              print(json.load(response)['commit']['sha'])
          PY

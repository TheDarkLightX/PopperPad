name: Apply PR 9 review fixes

on:
  pull_request:
    paths:
      - '.github/workflows/apply-pr9-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/fcis-recipe-transition' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fcis-recipe-transition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tighten persisted recipe environment boundary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: agent/fcis-recipe-transition
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          validate = Path('src/popperpad/validate.py')
          text = validate.read_text(encoding='utf-8')
          old = '    require_mapping(obj.get("env", {}), "recipe.env must be an object")\n\n    files = obj.get("files", {})\n'
          new = '''    env = obj.get("env", {})
              require_mapping(env, "recipe.env must be an object")
              for key, value in env.items():
                  require_str(key, "recipe.env keys must be strings")
                  require(bool(key), "recipe.env keys must be non-empty")
                  require(
                      value is None or isinstance(value, str),
                      "recipe.env values must be strings or null",
                  )

              files = obj.get("files", {})
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old in text:
              validate.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'recipe.env values must be strings or null' not in text:
              raise SystemExit('validate.py review-fix anchor missing')

          tests = Path('tests/test_runner_fcis.py')
          text = tests.read_text(encoding='utf-8')
          if 'from popperpad.refs import ValidationError' not in text:
              text = text.replace(
                  'from popperpad.runner import run_recipe\n',
                  'from popperpad.refs import ValidationError\nfrom popperpad.runner import run_recipe\nfrom popperpad.schemas import SCHEMA_RECIPE_V1\nfrom popperpad.validate import validate_object\n',
                  1,
              )
          if 'test_persisted_recipe_rejects_environment_values_the_runtime_cannot_execute' not in text:
              text += '''

          def test_persisted_recipe_rejects_environment_values_the_runtime_cannot_execute() -> None:
              recipe = {
                  "schema": SCHEMA_RECIPE_V1,
                  "recipe_id": "invalid-env",
                  "argv": ["tool"],
                  "env": {"COUNT": 3},
              }
              with pytest.raises(ValidationError, match="env values must be strings or null"):
                  validate_object(recipe)


          def test_persisted_recipe_accepts_string_and_null_environment_values() -> None:
              recipe = {
                  "schema": SCHEMA_RECIPE_V1,
                  "recipe_id": "valid-env",
                  "argv": ["tool"],
                  "env": {"MODE": "verify", "REMOVED": None},
              }
              validate_object(recipe)
              planned = plan_recipe(recipe)
              assert isinstance(planned, RecipePlan)
              assert planned.env["MODE"] == "verify"
              assert planned.env["REMOVED"] is None
          '''
              text = '\n'.join(line[10:] if line.startswith('          ') else line for line in text.splitlines()) + '\n'
          tests.write_text(text, encoding='utf-8')

          os.system("python -m pip install -e '.[dev]' >/dev/null")
          if os.system('python -m pytest -q tests/test_runner_fcis.py tests/test_recipe_features.py') != 0:
              raise SystemExit('targeted tests failed')

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'popperpad-pr9-fixer',
          }
          for path in (validate, tests):
              quoted = urllib.parse.quote(str(path), safe='/')
              url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/contents/{quoted}"
              req = urllib.request.Request(url + '?ref=' + urllib.parse.quote(os.environ['GH_BRANCH']), headers=headers)
              with urllib.request.urlopen(req) as response:
                  current = json.load(response)
              body = json.dumps({
                  'message': f'Address PR 9 review: {path}',
                  'content': base64.b64encode(path.read_bytes()).decode('ascii'),
                  'sha': current['sha'],
                  'branch': os.environ['GH_BRANCH'],
              }).encode('utf-8')
              req = urllib.request.Request(url, data=body, method='PUT', headers=headers)
              with urllib.request.urlopen(req) as response:
                  print(json.load(response)['commit']['sha'])
          PY

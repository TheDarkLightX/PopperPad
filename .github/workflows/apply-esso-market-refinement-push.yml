name: Apply ESSO market refinement push

on:
  push:
    branches: [agent/esso-market-refinement]
    paths:
      - '.github/workflows/apply-esso-market-refinement-push.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esso-market-refinement
          fetch-depth: 0
      - name: Materialize reviewed source payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import zipfile
          from pathlib import Path

          source = Path('.github/workflows/apply-esso-market-refinement.yml').read_text(encoding='utf-8')
          encoded = source.split("<<'PAYLOAD'\n", 1)[1].split("\nPAYLOAD\n", 1)[0].strip()
          expected = {
              'src/popperpad/core/market.py',
              'src/popperpad/esso_market_adapter.py',
              'tests/test_market_transitions.py',
              'tests/test_esso_market_adapter.py',
          }
          archive = zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded, validate=True)))
          names = set(archive.namelist())
          if names != expected:
              raise SystemExit(f'archive paths differ: {sorted(names)}')
          for name in sorted(names):
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(archive.read(name))
          PY
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add src/popperpad/core/market.py src/popperpad/esso_market_adapter.py tests/test_market_transitions.py tests/test_esso_market_adapter.py
          if git diff --cached --quiet; then
            echo 'No source changes to apply.'
            exit 0
          fi
          git commit -m 'Prove the market through an ESSO runtime boundary'
          git push origin HEAD:agent/esso-market-refinement
